name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project
        run: unzip -q "$(find . -name AutoSwipeRight.zip | head -n 1)"

      - name: Build debug APK
        working-directory: AutoSwipeRight
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSwipeRight-debug-apk
          path: AutoSwipeRight/app/build/outputs/apk/debug/app-debug.apk
